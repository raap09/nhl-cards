name: NHL - Jogos de hoje

on:
  schedule:
    - cron: "0 13 * * *"   # 10h de Brasília, todo dia
  workflow_dispatch:        # botão "Run workflow" pra rodar na hora

jobs:
  card:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências e fonte Inter
        run: |
          pip install playwright requests
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-inter || echo 'fonte Inter indisponível, seguindo'

      - name: Gerar card
        run: |
          ls -la
          python nhl_jogos_hoje.py --saida jogos-hoje.png
          echo "HOJE=$(TZ=America/Sao_Paulo date +%d/%m)" >> $GITHUB_ENV

      - name: Enviar por e-mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: NHL Cards <${{ secrets.GMAIL_USER }}>
          to: ${{ secrets.GMAIL_USER }}
          subject: "NHL hoje ${{ env.HOJE }} - card do Story"
          body: "Card(s) de hoje em anexo. Em dia cheio vem 1/2 e 2/2: posta na ordem."
          attachments: jogos-hoje*.png

      - uses: actions/upload-artifact@v5
        with:
          name: jogos-hoje
          path: jogos-hoje*.png
          retention-days: 14
