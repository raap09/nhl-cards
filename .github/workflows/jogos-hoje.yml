name: NHL - Jogos de hoje

on:
  schedule:
    - cron: "0 13 * * *"   # 10h de Brasília, todo dia
  workflow_dispatch:        # botão "Run workflow" pra rodar na hora

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências e fonte Inter
        run: |
          pip install playwright requests
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-inter
      - name: Gerar card
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python nhl_jogos_hoje.py --saida jogos-hoje.png
      - uses: actions/upload-artifact@v4
        with:
          name: jogos-hoje
          path: jogos-hoje.png
          retention-days: 14
